[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liftmath"
version = "2.4.0"
description = "A simple gym calculator: estimate a 1RM from a set, work out which plates to load, and score relative strength (Wilks/DOTS/IPF GL). Pure Python stdlib."
readme = "README.md"
license = { text = "Prosperity Public License 3.0.0" }
requires-python = ">=3.10"
authors = [{ name = "Cole Munz" }]
keywords = ["one-rep-max", "1rm", "plate-calculator", "wilks", "dots", "ipf-gl", "powerlifting", "strength-training"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    # Prosperity 3.0.0 isn't OSI-approved, so no "License :: OSI Approved :: ..." trove entry applies.
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/munzzyy/liftmath"
Changelog = "https://github.com/munzzyy/liftmath/blob/main/CHANGELOG.md"
Issues = "https://github.com/munzzyy/liftmath/issues"

[project.scripts]
liftmath = "liftmath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Generated dataset (tools/build_records.py) - long lines live inside its
# embedded JSON body (athlete notes, source URLs), not in code.
"src/liftmath/_records_data.py" = ["E501"]
