name: Feature request
description: Suggest a new command, flag, or library-level capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What are you trying to do that liftmath can't do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A new subcommand, a new flag on an existing one, a new library function, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Can you already do this by combining existing commands, or scripting around the library API?
    validations:
      required: false
