name: Formula or data proposal
description: Propose a new/changed 1RM formula, plate-loading rule, or relative-strength coefficient
labels: ["enhancement", "data"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this
      options:
        - New or changed 1RM formula
        - New or changed plate-loading rule
        - New or changed relative-strength coefficient (Wilks/DOTS/IPF GL)
        - Other
    validations:
      required: true

  - type: textarea
    id: citation
    attributes:
      label: Source
      description: >-
        Author, year, and where it was published (journal, book, federation
        name). liftmath's whole premise is that every number traces to a named
        source, so this is required, not optional.
      placeholder: "Brzycki, M. (1993). Strength testing... JOPERD 64(1), 88-90."
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: What should change
      description: The formula/value/fraction itself, and which file it belongs in.
    validations:
      required: true

  - type: textarea
    id: reference-value
    attributes:
      label: A hand-checked reference value
      description: >-
        A worked example (input -> expected output) you've verified by hand,
        that could become a test case. See CONTRIBUTING.md.
    validations:
      required: false
