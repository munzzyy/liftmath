name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package (no runtime dependencies)
        run: pip install -e .

      - name: Install test and lint tools
        run: pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Smoke-test the CLI end to end
        run: |
          liftmath --version
          liftmath 1rm --weight 225 --reps 5
          liftmath plates --target 245
          liftmath plates --target 405 --inventory 45x3,25x1,10x1
          liftmath standards --total 1200 --bodyweight 200 --sex male
          liftmath convert --weight 225 --unit lb
          liftmath 1rm --weight 225 --reps 5 --json
          liftmath --json plates --target 245

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: CITATION.cff and __init__.py versions match pyproject.toml
        run: python tools/check_citation_version.py
