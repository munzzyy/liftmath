name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package (no runtime dependencies)
        run: pip install -e .

      - name: Install test and lint tools
        run: pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Smoke-test the CLI end to end
        run: |
          liftmath --version
          liftmath 1rm --weight 225 --reps 5
          liftmath plates --target 245
          liftmath plates --target 405 --inventory 45x3,25x1,10x1
          liftmath standards --total 1200 --bodyweight 200 --sex male
          liftmath convert --weight 225 --unit lb
          liftmath records --sport powerlifting --lift deadlift --sex male --bodyweight 220 --equip raw --compare 500
          liftmath records --sport track --event 100m --sex male --level world --compare 12.4
          liftmath 1rm --weight 225 --reps 5 --json
          liftmath --json plates --target 245
          liftmath --json records --sport strongman --sex female
          printf 'Date,Workout Name,Duration,Exercise Name,Set Order,Weight,Reps,Distance,Seconds,Notes,Workout Notes,RPE\n2026-06-01 18:00:00,"Push Day",1h,"Bench Press (Barbell)",1,185,5,0,0,,,\n' > /tmp/smoke_strong.csv
          liftmath import --file /tmp/smoke_strong.csv
          liftmath --json import --file /tmp/smoke_strong.csv

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: CITATION.cff and __init__.py versions match pyproject.toml
        run: python tools/check_citation_version.py
